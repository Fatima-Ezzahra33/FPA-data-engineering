
services:

  # ============================================
  # APACHE KAFKA
  # ============================================
  kafka:
    image: apache/kafka:4.2.2
    hostname: kafka

    ports:
      - "127.0.0.1:9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:29093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - fpa-network

    restart: unless-stopped

  # ============================================
  # SPARK MASTER
  # ============================================
  spark-master:
    image: apache/spark:4.2.0
    hostname: spark-master

    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

    ports:
      - "127.0.0.1:8080:8080"

    networks:
      - fpa-network

    restart: unless-stopped

  # ============================================
  # SPARK WORKER 1
  # ============================================
  spark-worker-1:
    image: apache/spark:4.2.0
    hostname: spark-worker-1

    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - --host
      - spark-worker-1
      - --cores
      - "2"
      - --memory
      - "2g"
      - --webui-port
      - "8081"
      - spark://spark-master:7077

    ports:
      - "127.0.0.1:8081:8081"

    depends_on:
      - spark-master

    networks:
      - fpa-network

    restart: unless-stopped

  # ============================================
  # SPARK WORKER 2
  # ============================================
  spark-worker-2:
    image: apache/spark:4.2.0
    hostname: spark-worker-2

    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - --host
      - spark-worker-2
      - --cores
      - "2"
      - --memory
      - "2g"
      - --webui-port
      - "8081"
      - spark://spark-master:7077

    ports:
      - "127.0.0.1:8082:8081"

    depends_on:
      - spark-master

    networks:
      - fpa-network

    restart: unless-stopped

  # ============================================
  # SPARK WORKER 3
  # ============================================
  spark-worker-3:
    image: apache/spark:4.2.0
    hostname: spark-worker-3

    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - --host
      - spark-worker-3
      - --cores
      - "2"
      - --memory
      - "2g"
      - --webui-port
      - "8081"
      - spark://spark-master:7077

    ports:
      - "127.0.0.1:8083:8081"

    depends_on:
      - spark-master

    networks:
      - fpa-network

    restart: unless-stopped

  # ============================================
  # HDFS NAMENODE
  # ============================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    hostname: namenode

    environment:
      CLUSTER_NAME: fpa-hdfs
      CORE_CONF_fs_defaultFS: "hdfs://namenode:9000"
      HDFS_CONF_dfs_replication: "1"
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"

    ports:
      - "127.0.0.1:9870:9870"

    volumes:
      - hdfs-namenode:/hadoop/dfs/name

    networks:
      - fpa-network

    restart: unless-stopped

  # ============================================
  # HDFS DATANODE
  # ============================================
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode

    environment:
      CORE_CONF_fs_defaultFS: "hdfs://namenode:9000"
      HDFS_CONF_dfs_replication: "1"
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check: "false"
      SERVICE_PRECONDITION: "namenode:9870"

    depends_on:
      - namenode

    volumes:
      - hdfs-datanode:/hadoop/dfs/data

    networks:
      - fpa-network

    restart: unless-stopped

  # ============================================
  # GENERAL SPARK SUBMIT (BATCH JOBS)
  # ============================================
  spark-submit:
    image: apache/spark:4.2.0
    hostname: spark-submit

    profiles:
      - tools

    entrypoint: ["/opt/spark/bin/spark-submit"]
    working_dir: /opt/fpa

    environment:
      HOME: /tmp
      SPARK_LOCAL_HOSTNAME: spark-submit

    volumes:
      - ./spark/dist:/opt/fpa/dist:ro
      - ./data/raw:/opt/fpa/data/raw:ro

    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - spark-worker-3
      - kafka
      - namenode
      - datanode

    networks:
      - fpa-network

  # ============================================
  # BRONZE STREAMING DRIVER
  # ============================================
  bronze-driver:
    image: apache/spark:4.2.0
    hostname: fpa-bronze-driver

    profiles:
      - tools

    entrypoint: ["/opt/spark/bin/spark-submit"]
    working_dir: /opt/fpa

    environment:
      HOME: /tmp
      SPARK_LOCAL_HOSTNAME: fpa-bronze-driver
      SPARK_SUBMIT_OPTS: "-Duser.home=/tmp"

    volumes:
      - ./spark/dist:/opt/fpa/dist:ro

    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - spark-worker-3
      - kafka
      - namenode
      - datanode

    networks:
      fpa-network:
        aliases:
          - fpa-bronze-driver

  # ============================================
  # SILVER STREAMING DRIVER
  # ============================================
  silver-driver:
    image: apache/spark:4.2.0
    hostname: fpa-silver-driver

    profiles:
      - tools

    entrypoint: ["/opt/spark/bin/spark-submit"]
    working_dir: /opt/fpa

    environment:
      HOME: /tmp
      SPARK_LOCAL_HOSTNAME: fpa-silver-driver

    volumes:
      - ./spark/dist:/opt/fpa/dist:ro

    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - spark-worker-3
      - kafka
      - namenode
      - datanode

    networks:
      fpa-network:
        aliases:
          - fpa-silver-driver

# ============================================
# PERSISTENT VOLUMES
# ============================================
volumes:
  kafka-data:
  hdfs-namenode:
  hdfs-datanode:

# ============================================
# DOCKER NETWORK
# ============================================
networks:
  fpa-network:
    driver: bridge
