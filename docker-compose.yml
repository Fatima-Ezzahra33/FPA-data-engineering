
services:
  kafka:
    image: apache/kafka:4.2.2
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:29093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - fpa-network

    restart: unless-stopped

  spark-master:
    image: apache/spark:4.2.0
    hostname: spark-master

    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

    ports:
      - "127.0.0.1:8080:8080"

    networks:
      - fpa-network

    restart: unless-stopped

  spark-worker:
    image: apache/spark:4.2.0
    hostname: spark-worker

    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "2"
      - --memory
      - "2g"
      - --webui-port
      - "8081"
      - spark://spark-master:7077

    ports:
      - "127.0.0.1:8081:8081"

    depends_on:
      - spark-master

    networks:
      - fpa-network

    restart: unless-stopped


  spark-submit:
    image: apache/spark:4.2.0
    hostname: spark-submit

    profiles:
      - tools

    entrypoint: ["/opt/spark/bin/spark-submit"]

    working_dir: /opt/fpa

    environment:
      HOME: /tmp
      SPARK_LOCAL_HOSTNAME: spark-submit

    volumes:
      - ./spark/dist:/opt/fpa/dist:ro

    depends_on:
      - spark-master
      - spark-worker
      - kafka

    networks:
      - fpa-network

volumes:
  kafka-data:

networks:
  fpa-network:
    driver: bridge
